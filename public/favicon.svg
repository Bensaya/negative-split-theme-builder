<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Negative Split">
  <title>Negative Split</title>
  <rect width="32" height="32" rx="7" fill="#18181b"/>
  <!-- Two halves of a race. The second bar is taller and set higher:
       a negative split is a second half run faster than the first. -->
  <rect x="7"  y="17" width="7" height="8"  rx="1.5" fill="#a3a3a3"/>
  <rect x="18" y="8"  width="7" height="17" rx="1.5" fill="#84cc16"/>
</svg>
